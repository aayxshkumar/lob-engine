<text class="txt" x="380" y="346" text-anchor="middle">add_limit latency, ns (gridlines = one 41.7 ns clock tick)</text>
<path class="line s0" d="M64.0,304.0H64.0V258.1H208.0V187.8H211.5V47.5H355.4V33.5H358.9V26.8H502.9V24.8H650.4V24.6H696.0"/>
<line class="line s0" x1="486" y1="36" x2="510" y2="36"/>
<text class="txt" x="516" y="40">v0: std::map levels</text>
<path class="line s1" d="M64.0,304.0H64.0V148.6H208.0V111.1H211.5V35.5H355.4V28.5H358.9V24.8H502.9V24.3H696.0"/>
